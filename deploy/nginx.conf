# Example: HTTPS in front of ASH Web Viewer with nginx.
# Copy to /etc/nginx/conf.d/ashweb.conf, set the server name and certificate paths, then:
#   sudo nginx -t && sudo systemctl reload nginx
# and switch on the three HTTPS settings in /opt/ashweb/config/application.yml.

server {
    listen 80;
    server_name ashweb.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ashweb.example.com;

    ssl_certificate     /etc/ssl/certs/ashweb.crt;
    ssl_certificate_key /etc/ssl/private/ashweb.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An Oracle ASH report may take up to three minutes to be written
        proxy_read_timeout 200s;
    }
}
